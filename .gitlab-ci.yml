stages:
  - lint
  - test

lint:
  stage: lint
  tags:
    - tango-ci
  image: gitlab.beamline:5050/beamline/tango-devices/tango-ci:latest
  script:
    # Scoped to linac/magnet/, linac/camera/, linac/beam/,
    # linac/vacuum/, and linac/safety/ -- the directories actually
    # audited against the TANGO guidelines checklist so far
    # (Part3_TANGO Ch2 LAB 2.7, 1 Sep 2026; Ch3 LAB 3.6, 4 Sep 2026;
    # Ch4 compliance audit + CI lab, 4 Sep 2026; Ch5 LAB 5.6
    # compliance audit, 8 Sep 2026; Ch6 compliance audit, 9 Sep 2026 --
    # linac/beam/ genuinely had 13 real ruff findings before this
    # widening, all fixed and reverified live, not just auto-fixed
    # blind). The rest of this repo (Ch1 practice files, protocols/,
    # zmq_lab/, tests/test_temperature_sensor.py) has real, known ruff
    # findings not yet triaged -- widen this scope deliberately,
    # chapter by chapter, not all at once.
    - ruff check linac/magnet/ linac/camera/ linac/beam/ linac/vacuum/ linac/safety/

test-runner:
  stage: test
  tags:
    - tango-ci
  image: gitlab.beamline:5050/beamline/tango-devices/tango-ci:latest
  script:
    - python3 -m pytest tests/ linac/vacuum/tests/ linac/safety/tests/ linac/magnet/tests/ linac/camera/tests/ linac/beam/tests/ -v
