stages:
  - lint
  - test

lint:
  stage: lint
  tags:
    - tango-ci
  image: gitlab.beamline:5050/beamline/tango-devices/tango-ci:latest
  script:
    # Every Python directory of the repo (the Sept 2026 practice code was
    # removed in handbook Part 3 Ch23). Settings are in ruff.toml.
    - ruff check linac/magnet/ linac/camera/ linac/beam/ linac/vacuum/ linac/safety/ sardana_controllers/
    # Layout is enforced too, on the same paths (handbook Part 3 Ch29; the
    # tree was formatted once before this check went in).
    - ruff format --check linac/magnet/ linac/camera/ linac/beam/ linac/vacuum/ linac/safety/ sardana_controllers/

test-runner:
  stage: test
  tags:
    - tango-ci
  image: gitlab.beamline:5050/beamline/tango-devices/tango-ci:latest
  script:
    # Self-contained: each suite starts its devices with DeviceTestContext,
    # so no Tango database is needed. vacuum/ and safety/ (process=False)
    # come first, before any suite starts a device in a subprocess.
    # The job also fails on any "Fatal Python error": the forked device
    # servers' crash traces never failed a test, so they used to pass
    # unnoticed (handbook Part 3, Ch26). pytest's status is kept in a file,
    # because a pipe would report tee's. The JUnit report feeds the
    # pipeline's Tests tab (Ch29).
    - |
      { python3 -m pytest linac/vacuum/tests/ linac/safety/tests/ linac/magnet/tests/ linac/camera/tests/ linac/beam/tests/ -v --junitxml=report.xml && rc=0 || rc=$?; echo "$rc" > pytest.rc; } 2>&1 | tee pytest.log
      rc=$(cat pytest.rc)
      if grep -n "Fatal Python error" pytest.log; then
        echo "test-runner: crash trace(s) in the log above (pytest exit $rc)"
        exit 1
      fi
      exit "$rc"
  # Published even when the job fails, so the failing tests show in the UI.
  artifacts:
    when: always
    reports:
      junit: report.xml

test-sardana:
  stage: test
  tags:
    - tango-ci
  image: gitlab.beamline:5050/beamline/tango-devices/tango-ci:latest
  # Not self-contained: these tests talk to the real Pool, MacroServer and
  # device servers on tango-ds.beamline through the real database, so they
  # need the fleet up and those servers on fixed, firewall-allowed ports
  # (28366-28369, set up as code in Ch29). Until Ch31 brings Sardana back on
  # the rebuilt fleet, this job is expected to fail; allow_failure keeps that
  # visible without turning the pipeline red. Ch31 removes allow_failure.
  allow_failure: true
  script:
    # test_state_one_fault_handling.py stays manual-only: it kills and
    # restarts the real faradaycup1 process with local pgrep/subprocess,
    # which cannot reach tango-ds.beamline from this container. Run it on
    # tango-ds.beamline itself.
    - TANGO_HOST=tango-db.beamline:10000 python3 -m pytest sardana_controllers/tests/ -v --ignore=sardana_controllers/tests/test_state_one_fault_handling.py
